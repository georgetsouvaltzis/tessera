<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#110912"/>
      <stop offset="100%" stop-color="#06040a"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7aef"/>
      <stop offset="100%" stop-color="#ff39d0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <rect x="19" y="18" width="58" height="13" rx="6.5" fill="url(#pink)" filter="url(#glow)"/>
  <rect x="42" y="18" width="12" height="57" rx="6" fill="#fff6ff"/>
  <rect x="26" y="57" width="44" height="13" rx="6.5" fill="url(#pink)" filter="url(#glow)"/>
</svg>
