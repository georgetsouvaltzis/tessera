site_name: Tessera
site_description: Build terminal apps that feel like real products.
site_dir: !ENV [TESSERA_SITE_DIR, /tmp/tessera-site-build]
docs_dir: ..
use_directory_urls: true
strict: true

exclude_docs: |
  .artifacts/**
  .config/**
  .docusaurus/**
  .github/**
  .idea/**
  .venv/**
  BenchmarkDotNet.Artifacts/**
  benchmarks/**
  bin/**
  coord/**
  docs/perf-baselines/**
  examples/**
  obj/**
  site/**
  src/**
  tests/**
  *.DotSettings
  *.cs
  *.csproj
  *.props
  *.slnx
  *.targets
  AGENTS.md
  dotnet-tools.json
  LICENSE
  README.md
  global.json

theme:
  name: material
  custom_dir: overrides
  logo: docs/assets/images/logo.svg
  favicon: docs/assets/images/favicon.svg
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - scheme: slate
      primary: black
      accent: pink
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Start Here:
      - Overview: docs/overview.md
      - Getting Started: docs/getting-started.md
      - Example Guide: docs/examples.md
      - Showcase: docs/showcase.md
  - Guides:
      - Theme System: docs/theme-system.md
      - Custom Components: docs/custom-components.md
      - Architecture Overview: docs/architecture-overview.md
  - Reference:
      - Public API Guidelines: docs/public-api-guidelines.md
      - Public API Inventory: docs/public-api-inventory.md
      - Specification: docs/spec.md
      - Terminal Compatibility: docs/terminal-font-capability-matrix.md
  - Project:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Support: SUPPORT.md
      - Code of Conduct: CODE_OF_CONDUCT.md
      - Security: SECURITY.md
      - Performance: docs/performance.md
      - Widget Roadmap: docs/widget-roadmap.md
      - Alpha Release Checklist: docs/alpha-release-checklist.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - docs/assets/stylesheets/extra.css
  - docs/assets/stylesheets/landing.css

copyright: Copyright &copy; 2026 Tessera
